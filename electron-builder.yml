appId: com.theartemmaps1.clawd
productName: Clawd
copyright: Copyright (c) 2026 theartemmaps1

directories:
  output: dist
  buildResources: build

# Whitelist: only the app's own source goes into the asar.
# dev/ (local dev tools), screenshots/, docs and tests stay out.
files:
  - "*.js"
  - "*.html"
  - "!*.test.js"
  - "!dev/**"

# Shipped outside the asar: config.json is meant to be edited, and the uninstaller runs
# disconnect-hooks.js with the app's own runtime (it needs connect-hooks.js beside it).
extraResources:
  - from: config.json
    to: config.json
  - from: disconnect-hooks.js
    to: disconnect-hooks.js
  - from: connect-hooks.js
    to: connect-hooks.js

asar: true
compression: normal

# In-app updates read the latest release from here (the repo must be public).
publish:
  provider: github
  owner: theartemmaps1
  repo: clawd-the-buddy
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Clawd-Setup-${version}.exe

nsis:
  # A real wizard, not one click.
  oneClick: false
  perMachine: false          # per-user: no admin prompt, and updates can run silently
  allowElevation: false      # keeps the "install for all users?" page out of the wizard
  allowToChangeInstallationDirectory: true
  license: LICENSE
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: Clawd
  uninstallDisplayName: Clawd
  # his artwork
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # extra pages: repair / update / uninstall, first-run choices, uninstall clean-up options
  include: build/installer.nsh
  # his memories are handled by the uninstaller's own page, not by electron-builder
  deleteAppDataOnUninstall: false
  differentialPackage: true
