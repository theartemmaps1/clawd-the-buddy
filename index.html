<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }

  #bubble {
    pointer-events: none;
    max-width: 210px; min-height: 18px; margin-bottom: 8px; padding: 8px 12px;
    background: #fff; color: #222; border-radius: 14px; font-size: 12px; line-height: 1.35;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); word-break: break-word;
    opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s;
  }
  #bubble.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* --size shrinks while he is young (and in quiet mode); the margin keeps his feet on the floor */
  #buddy { width: var(--size, 150px); height: var(--size, 150px); margin-bottom: calc((var(--size, 150px) - 150px) * .2); flex: none; overflow: visible; shape-rendering: crispEdges; cursor: grab; touch-action: none; }
  #buddy .ghost { pointer-events: none; }
  .skin { fill: var(--skin, #d97757); transition: fill .3s, filter .2s; }
  /* friendship shows: a little brighter at each level, a faint blush, then sparkles */
  [data-bond="2"] .skin { filter: saturate(1.08) brightness(1.02); }
  [data-bond="3"] .skin, [data-bond="4"] .skin { filter: saturate(1.16) brightness(1.05); }
  [data-bond="3"] .blush, [data-bond="4"] .blush { opacity: .4; }
  .eye, .eye-happy rect { fill: #1f1410; }
  .eye { transform-box: fill-box; transform-origin: center; transition: transform .15s; }
  .eye, .eye-happy { translate: var(--lx, 0px) var(--ly, 0px); } /* follows the cursor */
  .legA, .legB, .armR { transform-box: fill-box; }
  #heart { fill: #ff5a7a; opacity: 0; }
  .zz { fill: #fff; font: bold 22px monospace; opacity: 0; }
  .eye-happy { opacity: 0; }
  .arm { transition: transform .15s; }
  #sweat { fill: #6cc8ff; opacity: 0; }

  /* ---- states ---- */
  #wrap { transform-origin: 100px 160px; rotate: var(--tilt, 0deg); transition: rotate .3s; } /* leans toward the cursor */
  .idle #wrap     { animation: bob 3s ease-in-out infinite; }
  .thinking #wrap { animation: bob 1.2s ease-in-out infinite; }
  .working #wrap  { animation: type .35s ease-in-out infinite; }
  .happy #wrap    { animation: hop .5s ease-in-out 3; }
  .sad #wrap      { transform: scaleY(.92); }
  .alert #wrap    { animation: wiggle .25s ease-in-out infinite; }

  .idle .eye     { animation: blink 4s infinite; }
  .thinking .eye { transform: translate(5px,-5px); }
  .working .eye  { transform: translateY(5px); }
  .sad .eye      { transform: translateY(6px) scaleY(.5); }
  .alert .eye    { transform: scaleY(1.4); }
  .happy .eye    { opacity: 0; }
  .happy .eye-happy { opacity: 1; }

  .working .legA { animation: step .3s steps(2) infinite; }
  .working .legB { animation: step .3s steps(2) infinite reverse; }
  .happy .arm, .alert .arm { transform: translateY(-20px); }
  .sad .arm { transform: translateY(10px); }

  /* tints are filters, so they work on whichever body colour is worn */
  .sad #sweat { opacity: 1; }
  .alert .skin { filter: saturate(1.35) brightness(1.08) hue-rotate(-8deg); }
  .sad .skin { filter: saturate(.45) brightness(.95); }
  .alert #buddy { cursor: pointer; }

  /* ---- moods (only applied while no state or reaction has its own face) ---- */
  .brow rect { fill: #1f1410; }
  .brow, .lid, .blush { opacity: 0; transition: opacity .3s; }
  .brow, .lid { translate: var(--lx, 0px) var(--ly, 0px); }
  .blush { fill: #ff9a8a; }

  .mood-joyful .blush       { opacity: .85; }
  .mood-joyful .skin        { filter: brightness(1.08) saturate(1.1); }
  .mood-joyful.idle #wrap   { animation-duration: 1.6s; }
  .mood-grumpy .brow-angry  { opacity: 1; }
  .mood-grumpy .skin        { filter: hue-rotate(-10deg) saturate(1.2) brightness(.94); }
  .mood-worried .brow-sad   { opacity: 1; }
  .mood-worried #sweat      { opacity: 1; }
  .mood-tired .lid, .mood-lonely .lid, .mood-glum .lid { opacity: 1; }
  .mood-lonely .brow-sad, .mood-hungry .brow-sad { opacity: 1; }
  .mood-tired .skin, .mood-lonely .skin, .mood-glum .skin, .mood-hungry .skin { filter: saturate(.7); }
  .mood-tired.idle #wrap, .mood-lonely.idle #wrap, .mood-glum.idle #wrap { animation-duration: 5s; }

  /* the stronger feelings get a mouth, and eyes of their own */
  .face { fill: #1f1410; }
  .face, .tear, .eye-shine, .eye-heart, .mark, .sparkle, .note-fx, .drop, .tongue { opacity: 0; }
  .tongue { fill: #ff7a9a; }
  .face, .eye-shine, .eye-heart { transition: opacity .3s; }
  .eye-shine { fill: #fff; translate: var(--lx, 0px) var(--ly, 0px); }
  .eye-heart { fill: #ff5a7a; }
  .tear { fill: #6cc8ff; transform-box: fill-box; }
  .mark { fill: #ffcf3a; font: bold 40px monospace; stroke: #1f1410; stroke-width: 3px; paint-order: stroke; }
  .sparkle { fill: #fff3b0; }
  .note-fx { fill: #fff; font: bold 24px monospace; }
  .drop { fill: #6cc8ff; transform-box: fill-box; }

  .mood-joyful .m-smile, .mood-proud .m-smile, .mood-loving .m-smile { opacity: 1; }
  .mood-glum .m-frown, .mood-lonely .m-frown, .mood-grumpy .m-frown, .mood-jealous .m-frown { opacity: 1; }
  .mood-bored .m-flat { opacity: 1; }
  .mood-worried .m-wavy, .mood-scared .m-wavy, .mood-embarrassed .m-wavy { opacity: 1; }

  .mood-excited .m-o, .mood-excited .eye-shine { opacity: 1; }
  .mood-excited .blush      { opacity: .7; }
  .mood-excited.idle #wrap  { animation-duration: .6s; }
  .mood-proud .eye          { opacity: 0; }
  .mood-proud .eye-happy    { opacity: 1; }
  .mood-proud #wrap         { scale: 1.05; }
  .mood-proud .skin         { filter: brightness(1.1) saturate(1.15); }
  .mood-loving .eye         { opacity: 0; }
  .mood-loving .eye-heart   { opacity: 1; }
  .mood-loving .blush       { opacity: .9; }
  .mood-loving #heart       { animation: float 2.6s ease-out infinite; }
  .mood-scared #wrap        { animation: shiver .12s linear infinite; scale: .95; }
  .mood-scared .eye         { animation: none; transform: scaleY(1.4); }
  .mood-scared .brow-sad, .mood-scared #sweat { opacity: 1; }
  .mood-scared .skin        { filter: saturate(.55) brightness(1.1); }
  .mood-embarrassed .blush  { opacity: 1; }
  .mood-embarrassed .eye    { animation: none; transform: translateY(2px); } /* the cursor code turns them away from you */
  .mood-embarrassed #sweat  { opacity: 1; }
  .mood-jealous .lid, .mood-bored .lid { opacity: 1; }
  .mood-jealous .eye        { animation: none; transform: translateX(6px); }
  .mood-jealous .brow-angry { opacity: .8; }
  .mood-jealous .skin       { filter: hue-rotate(40deg) saturate(.8); } /* green with envy */
  .mood-bored.idle #wrap    { animation-duration: 6s; }
  .mood-bored .skin         { filter: saturate(.75); }
  /* hurt: small, drooping, and in tears */
  .mood-hurt .brow-sad, .mood-hurt .lid, .mood-hurt .m-frown { opacity: 1; }
  .mood-hurt .skin          { filter: saturate(.5) brightness(.96); }
  .mood-hurt #wrap          { scale: .93; }
  .mood-hurt.idle #wrap     { animation-duration: 5s; }
  .mood-hurt .arm           { transform: translateY(8px); }
  .mood-hurt .eye           { animation: none; transform: translateY(5px) scaleY(.7); }
  /* curious: head on one side, one eye wide */
  .mood-curious #wrap       { rotate: 7deg; }
  .mood-curious .eye        { animation: none; }
  .mood-curious .eye + .eye { transform: scaleY(1.35); }
  .mood-curious .mark-q, .mood-curious .eye-shine { opacity: 1; }
  /* grateful: shining eyes and a little bow, over and over */
  .mood-grateful #wrap      { animation: bow 2.6s ease-in-out infinite; }
  .mood-grateful .eye-shine, .mood-grateful .m-smile { opacity: 1; }
  .mood-grateful .blush     { opacity: .6; }
  /* relieved: slumped, eyes half shut, the last drop of sweat sliding off */
  .mood-relieved #wrap      { scale: 1.03 .97; }
  .mood-relieved .lid, .mood-relieved .m-smile { opacity: 1; }
  .mood-relieved.idle #wrap { animation-duration: 4.5s; }
  .mood-relieved #sweat     { animation: drip 2.2s ease-in infinite; }
  /* nostalgic and homesick: far away, with a picture of what he is thinking of */
  .mood-nostalgic .lid, .mood-nostalgic .m-smile { opacity: 1; }
  .mood-nostalgic .skin     { filter: sepia(.3); }
  .mood-nostalgic.idle #wrap, .mood-homesick.idle #wrap { animation-duration: 5s; }
  .mood-homesick .brow-sad, .mood-homesick .m-frown { opacity: 1; }
  .mood-homesick .eye       { animation: none; transform: translateY(4px); }
  .mood-homesick .skin      { filter: saturate(.75); }
  .mood-nostalgic .dream, .mood-homesick .dream { opacity: 1; }
  .mood-nostalgic .d-photo, .mood-homesick .d-home { display: block; }
  /* mischievous: sly eyes going from side to side, and a smirk */
  .mood-mischievous .brow-angry { opacity: .85; }
  .mood-mischievous .lid, .mood-mischievous .m-smirk { opacity: 1; }
  .mood-mischievous .eye    { animation: glance 3s ease-in-out infinite; }
  /* focused: narrowed eyes, tongue out at the corner */
  .mood-focused #wrap       { animation: none; }
  .mood-focused .eye        { animation: none; transform: scaleY(.6); }
  .mood-focused .brow-angry { opacity: .55; }
  .mood-focused .m-flat     { opacity: 1; }
  .mood-focused .tongue     { opacity: 1; translate: 9px 0; }
  /* smug: one eyebrow up */
  .mood-smug #wrap          { scale: 1.04; }
  .mood-smug .brow-up, .mood-smug .lid, .mood-smug .m-smirk { opacity: 1; }
  .cry .tear                { animation: drip 1.1s linear infinite; }
  .cry .tear + .tear        { animation-delay: .5s; }

  [data-bond="4"].idle .sparkle rect { animation: twinkle 2.4s ease-in-out infinite; }
  [data-bond="4"].idle .sparkle rect:nth-child(2) { animation-delay: .6s; }
  [data-bond="4"].idle .sparkle rect:nth-child(3) { animation-delay: 1.2s; }
  [data-bond="4"].idle .sparkle rect:nth-child(4) { animation-delay: 1.8s; }
  body[class*="fx-"] .sparkle rect { animation: none !important; }

  .fx-hop #wrap { animation: hop .5s ease-in-out; }

  /* a start, a puzzled tilt, a shake of the head, a grimace */
  .fx-surprise #wrap { animation: hop .3s ease-out; }
  .fx-surprise .eye  { animation: none; transform: scaleY(1.4); }
  .fx-surprise .mark-bang, .fx-surprise .m-o { opacity: 1; }
  .fx-quest #wrap    { rotate: 9deg; }
  .fx-quest .mark-q  { opacity: 1; }
  .fx-shake #wrap    { animation: headshake .2s linear 8; }
  .fx-shake .eye     { animation: none; transform: scaleY(.15); }
  .fx-shake .drop-l  { animation: puffL .5s ease-out 3; }
  .fx-shake .drop-r  { animation: puffR .5s ease-out 3; }
  .fx-yuck #wrap     { animation: shiver .15s linear 6; }
  .fx-yuck .eye      { animation: none; transform: scaleY(.3); }
  .fx-yuck .m-wavy   { opacity: 1; }

  /* tricks */
  .fx-jump #wrap  { animation: bigjump .85s ease-out; }
  .fx-jump .arm   { transform: translateY(-20px); }
  .fx-jump .eye   { opacity: 0; }
  .fx-jump .eye-happy { opacity: 1; }
  .fx-twirl #wrap { animation: twirl .9s ease-in-out; rotate: 0deg; }
  .fx-dance #wrap { animation: sway .5s ease-in-out infinite; rotate: 0deg; }
  .fx-dance .arm  { animation: armswing .25s ease-in-out infinite alternate; }
  .fx-dance .legA { animation: step .25s steps(2) infinite; }
  .fx-dance .legB { animation: step .25s steps(2) infinite reverse; }
  .fx-dance .eye  { opacity: 0; }
  .fx-dance .eye-happy { opacity: 1; }
  .fx-dance .note-fx, body[data-hobby="hum"] .note-fx { animation: float 1.4s ease-out infinite; }
  .fx-dance .note-fx + .note-fx, body[data-hobby="hum"] .note-fx + .note-fx { animation-delay: .7s; }
  /* something is playing: a note drifts up now and then */
  body[data-tune="1"] .note-fx { animation: float 2.8s ease-out infinite; }
  body[data-tune="1"] .note-fx + .note-fx { animation-delay: 1.4s; }
  /* sitting: for the sit trick, and while knitting through a long command */
  .fx-sit #wrap, body[data-wait="knit"] #wrap, .cornered #wrap { animation: none; transform: translateY(18px); }
  .fx-sit .legA, .fx-sit .legB, body[data-wait="knit"] .legA, body[data-wait="knit"] .legB, .cornered .legA, .cornered .legB { animation: none; transform-origin: top; transform: scaleY(.4); }
  .fx-sit .shadow, body[data-wait="knit"] .shadow, .cornered .shadow { transform: translateY(-18px); }
  /* hurt, sitting in his corner: huddled down and leaning into the wall */
  .cornered[data-corner="l"] #wrap { rotate: -5deg; }
  .cornered[data-corner="r"] #wrap { rotate: 5deg; }
  .fx-hide #wrap { animation: none; }
  .fx-hide .eye  { animation: none; transform: scaleY(1.3); }

  /* waiting out a long command */
  .wait, .moment, .plan-item, .hobby, .dream-i { display: none; }
  body[data-wait="knit"] .wait-knit { display: block; }
  body[data-wait="knit"] .needles { animation: type .4s ease-in-out infinite; transform-origin: 100px 110px; }
  body[data-wait="tap"] #wrap { animation: none; }
  body[data-wait="tap"] .legA { animation: none; }
  body[data-wait="tap"] .legB { animation: tapfoot .45s steps(2) infinite; }
  body[data-wait="tap"] .lid  { opacity: 1; }

  /* things held up for a moment */
  body[data-moment="flag"] .mo-flag     { display: block; animation: plant .4s ease-out; }
  body[data-moment="plane"] .mo-plane   { display: block; animation: flyoff 1.6s ease-in forwards; }
  body[data-moment="popper"] .mo-popper { display: block; animation: hop .4s ease-out 2; }
  body[data-moment="tea"] .mo-tea, body[data-moment="water"] .mo-water { display: block; }
  body[data-moment="gift"] .mo-gift { display: block; animation: hop .6s ease-in-out infinite; }
  .steam { fill: #fff; animation: float 1.8s ease-out infinite; }
  .steam + .steam { animation-delay: .9s; }

  /* plan mode: a pencil behind the ear, and a blueprint when his hands are free */
  body[data-plan="1"] .pencil { display: block; }
  body[data-plan="1"].thinking:not([class*="fx-"]) .blueprint, body[data-plan="1"].idle:not([class*="fx-"]) .blueprint { display: block; }

  /* hobbies */
  .fx-hobby .season-item { display: none !important; }
  body[data-hobby="read"] .prop-book { display: block; }
  body[data-hobby="read"] .eye { animation: none; transform: translateY(5px); }
  body[data-hobby="juggle"] .h-juggle { display: block; }
  body[data-hobby="juggle"] .jug { animation: juggle 1.2s linear infinite; }
  body[data-hobby="juggle"] .jug:nth-child(2) { animation-delay: -.4s; }
  body[data-hobby="juggle"] .jug:nth-child(3) { animation-delay: -.8s; }
  body[data-hobby="juggle"] .arm { animation: armswing .3s ease-in-out infinite alternate; }
  body[data-hobby="juggle"] .eye, body[data-hobby="stargaze"] .eye { animation: none; transform: translateY(-6px); }
  body[data-hobby="stargaze"] .h-stars { display: block; }
  .h-stars rect { fill: #fff7c2; animation: twinkle 1.8s ease-in-out infinite; }
  .h-stars rect:nth-child(2n) { animation-delay: .6s; }
  .h-stars rect:nth-child(3n) { animation-delay: 1.1s; }
  body[data-hobby="water"] .h-water, body[data-hobby="water"] .h-plant { display: block; }
  body[data-hobby="water"] .wdrop { animation: drip .6s linear infinite; }
  .p1, .p2, .p3 { display: none; }
  body[data-plant="1"] .p1, body[data-plant="2"] .p1, body[data-plant="2"] .p2,
  body[data-plant="3"] .p1, body[data-plant="3"] .p2, body[data-plant="3"] .p3 { display: block; }
  body[data-hobby="hum"] #wrap { animation: sway 1.2s ease-in-out infinite; }
  body[data-hobby="exercise"] #wrap { animation: squat .8s ease-in-out infinite; }
  body[data-hobby="exercise"] .arm  { transform: translateY(-20px); }

  /* dreams: a thought bubble showing something from the day */
  .dream { opacity: 0; transition: opacity .4s; }
  body[data-dream]:not([data-dream=""]) .dream { opacity: 1; }
  body[data-dream]:not([data-dream=""]) .zz { animation: none; }
  body[data-dream="test"] .d-test, body[data-dream="bug"] .d-bug, body[data-dream="file"] .d-file, body[data-dream="commit"] .d-commit,
  body[data-dream="snack"] .d-snack, body[data-dream="ball"] .d-ball, body[data-dream="globe"] .d-globe, body[data-dream="heart"] .d-heart { display: block; }

  /* quiet mode: small and silent */
  /* growing up: small, round and big-eyed at first */
  body[data-age="baby"] { --size: 96px; }
  body[data-age="kid"]  { --size: 120px; }
  body[data-age="teen"] { --size: 138px; }
  body[data-age="baby"] .eye { scale: 1.35; }
  body[data-age="kid"] .eye  { scale: 1.15; }
  body[data-age="baby"] .skin rect { rx: 9px; }
  body[data-age="kid"] .skin rect  { rx: 4px; }
  [data-age="baby"] .blush { opacity: .55; }
  .curl { display: none; }
  body[data-age="baby"] .curl { display: block; }
  body.quiet { --size: 66px; }
  body.quiet[data-age="baby"] { --size: 50px; }

  /* sulking: back turned, one eye peeking over the shoulder he is facing */
  .peek, .backseam { display: none; }
  .peek { fill: #1f1410; }
  .backseam { fill: rgba(0,0,0,.12); }
  .sulk .eye, .sulk .eye-happy, .sulk .brow, .sulk .face, .sulk .lid, .sulk .blush { opacity: 0 !important; }
  .sulk .backseam { display: block; }
  .sulk[data-sulk="l"] .peek-l, .sulk[data-sulk="r"] .peek-r { display: block; }
  .sulk #wrap { animation: none; rotate: 0deg; }
  .sulk .arm  { transform: translateY(6px); }

  /* high five: for a moment after a task, an arm is up and waiting */
  .five { display: none; fill: #ffd84a; }
  body[data-five="1"] .five { display: block; animation: twinkle .5s ease-in-out infinite; }
  body[data-five="1"] .armR { transform-origin: left center; animation: wave .3s ease-in-out infinite; }

  /* the sign he holds up when Claude asks permission */
  #sign { display: none; position: relative; max-width: 190px; margin-bottom: 16px; padding: 5px 8px 6px; background: #fff6df; color: #3a2a10; border: 3px solid #8a5a2b; border-radius: 4px; font: 11px/1.3 Consolas, ui-monospace, monospace; word-break: break-all; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  #sign.show { display: block; }
  #sign b { display: block; margin-bottom: 2px; font: bold 10px system-ui, sans-serif; color: #8a5a2b; }
  #sign::after { content: ''; position: absolute; left: 50%; bottom: -19px; width: 5px; height: 16px; margin-left: -2px; background: #8a5a2b; }

  /* a friend's Clawd, come to visit */
  #visitor { position: absolute; left: 2px; bottom: 30px; width: 64px; display: none; flex-direction: column; align-items: center; cursor: pointer; }
  #visitor.here { display: flex; animation: walkin 1.6s steps(8); }
  #visitor.leaving { animation: walkout 1.6s steps(8) forwards; }
  #visitor span { max-width: 64px; margin-bottom: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: bold 9px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  #visitor svg { display: block; shape-rendering: crispEdges; overflow: visible; animation: bob 1s ease-in-out infinite; }
  #visitor.talk svg { animation: hop .4s ease-in-out 2; }
  body[data-visiting="1"] #minis { bottom: 112px; }
  @keyframes walkin  { from { transform: translateX(-90px) } to { transform: translateX(0) } }
  @keyframes walkout { to { transform: translateX(-90px) } }
  .quiet #minis, .quiet #helpers { opacity: .6; }

  /* ---- night: droopy eyes and a nightcap ---- */
  .nightcap { display: none; }
  .night .lid { opacity: 1; }
  .night .hat { display: none !important; }
  .night .nightcap { display: block; }
  .fx-pet .lid, .fx-spin .lid, .fx-sleep .lid, .fx-dizzy .lid, .fx-eat .lid, .fx-held .lid, .fx-fly .lid,
  .fx-fall .lid, .fx-want .lid, .fx-peer .lid, .fx-yawn .lid, .fx-stretch .lid, .fx-surprise .lid, .fx-jump .lid, .fx-dance .lid { opacity: 0; }
  /* feelings and hobbies with eyes of their own keep them, even when it is late */
  body.fx-hobby .lid, body.mood-proud .lid, body.mood-loving .lid, body.mood-excited .lid, body.mood-scared .lid { opacity: 0; }

  /* thinking: three dots drift up like a thought bubble */
  .dots rect { fill: #fff; opacity: 0; }
  .thinking .dots rect { animation: dot 1.5s ease-in-out infinite; }
  .thinking .dots rect:nth-child(2) { animation-delay: .25s; }
  .thinking .dots rect:nth-child(3) { animation-delay: .5s; }
  body[class*="fx-"] .dots rect { animation: none; }

  /* yawns, stretches, dust */
  .mouth { fill: #1f1410; opacity: 0; }
  .fx-yawn #wrap  { animation: yawn 1.8s ease-in-out; }
  .fx-yawn .eye   { animation: none; transform: scaleY(.1); }
  .fx-yawn .mouth { animation: gape 1.8s ease-in-out; }
  .fx-yawn .arm   { transform: translateY(-14px); }
  .fx-stretch #wrap { animation: stretch 2.5s ease-in-out; }
  .fx-stretch .arm  { transform: translateY(-24px); }
  .fx-stretch .eye  { opacity: 0; }
  .fx-stretch .eye-happy { opacity: 1; }
  .dust { fill: #e9e2d6; opacity: 0; transform-box: fill-box; }
  .fx-land .dust-l { animation: puffL .45s ease-out; }
  .fx-land .dust-r { animation: puffR .45s ease-out; }

  /* seasons, holidays and the focus timer's hourglass */
  .season-item, .hourglass { display: none; }
  body[data-season="winter"] .scarf, body[data-season="spring"] .flower, body[data-season="autumn"] .leaf { display: block; }
  body[data-season="summer"].idle:not([class*="fx-"]):not([class*="mood-"]):not(.night) .shades { display: block; }
  body[data-holiday="santa"] .santa, body[data-holiday="pumpkin"] .pumpkin, body[data-holiday="bday"] .bday { display: block; }
  body[data-holiday="santa"] .hat, body[data-holiday="bday"] .hat { display: none; }
  .night .santa, .fx-sleep .shades { display: none !important; }
  body[data-focus="1"] .hourglass { display: block; }

  /* glasses from the wardrobe, or because he is getting on a bit; and the egg he keeps warm, which cracks and then rocks */
  .specs, .egg, .egg .crack { display: none; }
  .specs rect { fill: none; stroke: #5d4a3a; stroke-width: 3px; }
  body[data-old="1"] .specs, body[data-glasses="1"] .specs { display: block; }
  .sulk .specs, .fx-sleep .specs { display: none !important; }
  body[data-egg="1"] .egg, body[data-egg="2"] .egg, body[data-egg="3"] .egg { display: block; }
  body[data-egg="2"] .egg .crack, body[data-egg="3"] .egg .crack { display: block; }
  body[data-egg="3"] .egg { transform-box: fill-box; transform-origin: center bottom; animation: wiggle .3s ease-in-out infinite; }
  body:not([data-egg=""]) .leaf, body:not([data-egg=""]) .pumpkin { display: none; }
  body[data-hobby="water"] .egg { display: none; }
  body[data-focus="1"] .hourglass .sand { animation: trickle 2s steps(4) infinite; }

  /* sticky note, and the box for writing one */
  #note {
    position: absolute; right: 6px; bottom: 118px; width: 74px; max-height: 74px; overflow: hidden; padding: 5px 6px;
    background: #ffe873; color: #3a2f00; font-size: 10px; line-height: 1.25; word-break: break-word;
    box-shadow: 0 2px 5px rgba(0,0,0,.3); transform: rotate(3deg); cursor: pointer; display: none;
  }
  #note.show { display: block; }
  #noteInput {
    position: absolute; left: 14px; right: 14px; top: 8px; display: none; box-sizing: border-box;
    font: 12px system-ui, sans-serif; padding: 6px 8px; border: 2px solid #d97757; border-radius: 8px; outline: none;
    background: #fff; color: #222; user-select: text;
  }
  #noteInput.show { display: block; }

  /* confetti for unlocks and big finishes */
  #confetti { position: absolute; left: 50%; bottom: 110px; width: 0; height: 0; pointer-events: none; }
  #confetti i { position: absolute; width: 6px; height: 6px; animation: burst 1.3s ease-out forwards; }

  /* ---- mouse reactions (layered over the state above) ---- */
  .fx-poke #wrap  { animation: squish .35s ease-out; }
  .fx-poke .eye   { animation: none; transform: scaleY(.2); }
  .fx-land #wrap  { animation: squish .4s ease-out; }

  .fx-held #wrap, .fx-fall #wrap { animation: none; transform: translateY(-8px); }
  .fx-held #buddy { cursor: grabbing; }
  .fx-held .eye, .fx-fall .eye, .fx-fly .eye { animation: none; transform: scaleY(1.4); opacity: 1; }
  .fx-held .eye-happy, .fx-fall .eye-happy, .fx-fly .eye-happy { opacity: 0; }
  .fx-held .arm, .fx-fall .arm, .fx-fly .arm { transform: translateY(-20px); }
  .fx-held .legA, .fx-fall .legA, .fx-fly .legA { transform-origin: top; animation: dangle .35s ease-in-out infinite alternate; }
  .fx-held .legB, .fx-fall .legB, .fx-fly .legB { transform-origin: top; animation: dangle .35s ease-in-out infinite alternate-reverse; }
  /* thrown hard: tumbles through the air */
  .fx-fly #wrap   { transform-origin: 100px 110px; animation: tumble .7s linear infinite; }

  .fx-pet #wrap   { animation: bob .6s ease-in-out infinite; }
  .fx-pet .eye    { opacity: 0; }
  .fx-pet .eye-happy { opacity: 1; }
  .fx-pet #heart  { animation: float 1.1s ease-out 2; }
  /* petted while already smiling or blushing: that stays, only the eyes change */
  .kept-loving .m-smile, .kept-joyful .m-smile, .kept-proud .m-smile,
  .kept-grateful .m-smile, .kept-relieved .m-smile, .kept-nostalgic .m-smile { opacity: 1; }
  .kept-loving .blush { opacity: .9; }
  .kept-grateful .blush { opacity: .6; }
  .kept-joyful .blush { opacity: .85; }
  .kept-excited .blush { opacity: .7; }
  .kept-embarrassed .blush { opacity: 1; }

  /* a hug for you, when your day is going badly */
  .fx-hug #wrap   { animation: bob .8s ease-in-out infinite; scale: 1.06; }
  .fx-hug .arm    { transform: translateY(-12px); }
  .fx-hug .eye    { opacity: 0; }
  .fx-hug .eye-happy { opacity: 1; }
  .fx-hug .blush  { opacity: .8; }
  .fx-hug .lid, .fx-hug #sweat { opacity: 0; }
  .fx-hug .skin   { filter: brightness(1.05); }
  .fx-hug #heart  { animation: float 1.3s ease-out 2; }
  .fx-hug .tear   { animation: none; }

  /* tapping on the glass for attention */
  .fx-knock #wrap { animation: knock .5s ease-in-out 3; }
  .fx-knock .arm  { transform: translateY(-16px); }
  .fx-knock .eye  { animation: none; transform: scaleY(1.3); }
  .fx-knock .lid  { opacity: 0; }

  /* the teenage eye roll */
  .fx-eyeroll .eye    { animation: eyeroll .9s ease-in-out; translate: 0 0; }
  .fx-eyeroll .lid    { opacity: 0; }
  .fx-eyeroll .m-flat { opacity: 1; }

  /* a prank: one eye shut and the tongue out */
  .fx-tease #wrap { animation: wiggle .25s ease-in-out 6; }
  .fx-tease .eye  { animation: none; }
  .fx-tease .eye + .eye { transform: scaleY(.15); }
  .fx-tease .m-smile { opacity: 1; }
  .fx-tease .tongue { opacity: 1; translate: 0 4px; }
  .fx-tease .lid  { opacity: 0; }

  /* ---- personalities: how each one carries himself ---- */
  /* data-persona is on the whole time; data-manner only while no reaction or mood has his face */
  .fingers { display: none; filter: brightness(.78); }
  .fingers rect { fill: var(--skin, #d97757); transform-box: fill-box; }
  body[data-fidget="1"] .fingers, .fx-fidget .fingers { display: block; }
  body[data-fidget="1"] .arm, .fx-fidget .arm { visibility: hidden; }
  body[data-fidget="1"] .fingers rect, .fx-fidget .fingers rect { animation: tapL .5s ease-in-out infinite; }
  body[data-fidget="1"] .fingers rect + rect, .fx-fidget .fingers rect + rect { animation-name: tapR; }
  .fx-fidget .lid { opacity: 0; }
  /* hungry: a hand going round and round on his tummy */
  .belly { display: none; filter: brightness(.78); }
  .belly rect { fill: var(--skin, #d97757); transform-box: fill-box; }
  .fx-rub .belly { display: block; }
  .fx-rub .belly rect { animation: rub .8s linear infinite; }
  .fx-rub .armR { visibility: hidden; }
  .fx-rub .eye { animation: none; transform: translateY(5px); }

  /* shy: blushes when looked at or touched, eyes on the floor, fingers tapping together */
  body[data-persona="shy"][data-fidget="1"] .blush, body[data-persona="shy"].fx-fidget .blush,
  body[data-persona="shy"].fx-poke .blush, body[data-persona="shy"].fx-held .blush, body[data-persona="shy"].fx-wave .blush { opacity: .9; }
  body[data-persona="shy"].fx-fidget .eye { animation: none; transform: translate(-5px, 6px); translate: 0 0; }
  body[data-persona="shy"][data-fidget="1"] #wrap, body[data-persona="shy"].fx-fidget #wrap { scale: .96; }
  /* anxious: eyes darting while Claude thinks, hands wringing, a bead of sweat */
  body[data-persona="anxious"][data-fidget="1"] .eye, body[data-persona="anxious"].fx-fidget .eye { animation: glance 1.2s ease-in-out infinite; transform: none; }
  body[data-persona="anxious"][data-fidget="1"] .fingers rect, body[data-persona="anxious"].fx-fidget .fingers rect { animation-duration: .25s; }
  body[data-persona="anxious"].fx-fidget #sweat, body[data-persona="anxious"][data-fidget="1"] #sweat { opacity: .8; }
  body[data-persona="anxious"].fx-fidget .m-wavy { opacity: 1; }
  /* sleepy: eyes never quite open, everything slower; now and then his head drops */
  body[data-manner="sleepy"] .lid { opacity: 1; }
  body[data-manner="sleepy"].idle #wrap { animation-duration: 5s; }
  .fx-nod #wrap   { animation: nod 2.4s ease-in-out; }
  .fx-nod .eye    { animation: doze 2.4s ease-in-out; }
  .fx-nod .lid    { opacity: 1; }
  /* wise: unhurried; shuts his eyes to think a thing over */
  body[data-manner="wise"].idle #wrap { animation-duration: 4.2s; }
  .fx-ponder #wrap { animation: bob 3.2s ease-in-out; }
  .fx-ponder .eye { animation: none; transform: scaleY(.15); }
  .fx-ponder .m-flat { opacity: 1; }
  .fx-ponder .lid { opacity: 0; }
  body.fx-ponder .dots rect { animation: dot 1.5s ease-in-out infinite; }
  body.fx-ponder .dots rect:nth-child(2) { animation-delay: .25s; }
  body.fx-ponder .dots rect:nth-child(3) { animation-delay: .5s; }
  /* nerdy: leans in to inspect whatever he is looking at */
  body[data-persona="nerdy"].fx-peer .eye-shine { opacity: 1; }
  body[data-manner="nerdy"].thinking .eye { transform: translate(5px,-5px) scaleY(1.15); }
  /* sarcastic: deadpan */
  body[data-manner="sarcastic"].idle .lid { opacity: .85; }
  body[data-manner="sarcastic"].idle .m-flat { opacity: 1; }
  /* dramatic: everything is bigger; a failure is a tragedy */
  body[data-persona="dramatic"].happy #wrap { scale: 1.08; }
  body[data-persona="dramatic"].sad .tear { animation: drip 1.1s linear infinite; }
  body[data-persona="dramatic"].sad .tear + .tear { animation-delay: .5s; }
  body[data-persona="dramatic"].sad .arm { transform: translateY(-22px); }
  body[data-persona="dramatic"].fx-poke .mark-bang { opacity: 1; }

  .fx-spin #wrap  { transform-origin: 100px 110px; animation: flip .7s ease-in-out; }
  .fx-spin .eye   { opacity: 0; }
  .fx-spin .eye-happy { opacity: 1; }
  .fx-spin .arm   { transform: translateY(-20px); }

  .fx-dizzy #wrap { animation: sway .9s ease-in-out infinite; }
  .fx-dizzy .eye  { animation: roll .45s linear infinite; opacity: 1; translate: 0 0; }
  .fx-dizzy .eye-happy { opacity: 0; }

  .fx-wave .armR  { transform-origin: left center; animation: wave .3s ease-in-out 3; }

  .fx-sleep #wrap { animation: breathe 4s ease-in-out infinite; }
  .fx-sleep .eye  { animation: none; transform: scaleY(.1); translate: 0 4px; }
  .fx-sleep .zz   { animation: float 3s ease-out infinite; }
  .fx-sleep .zz + .zz { animation-delay: 1.5s; }

  .fx-spin #wrap, .fx-sleep #wrap, .fx-dizzy #wrap, .fx-fly #wrap { rotate: 0deg; }

  /* curiosity */
  .fx-peer #wrap  { animation: peer 2.5s ease-in-out; rotate: calc(var(--tilt, 0deg) * 2.5); }
  .fx-peer .eye   { animation: none; transform: scaleY(1.35); }
  .fx-look .eye   { animation: glance 2.4s ease-in-out; translate: 0 0; }
  .fx-walk #wrap  { animation: bob .3s ease-in-out infinite; }
  .fx-walk .legA  { animation: step .3s steps(2) infinite; }
  .fx-walk .legB  { animation: step .3s steps(2) infinite reverse; }

  /* snacks */
  .fx-want #wrap  { animation: hop .4s ease-in-out infinite; }
  .fx-want .arm   { transform: translateY(-20px); }
  .fx-want .eye   { animation: none; transform: scaleY(1.4); }
  .fx-eat #wrap   { animation: chew .3s ease-in-out 6; }
  .fx-eat .eye    { opacity: 0; }
  .fx-eat .eye-happy { opacity: 1; }

  /* ---- hats (unlocked by finishing tasks) and props (what Claude is doing) ---- */
  .hat, .prop { display: none; }
  body[data-hat="sprout"] .hat-sprout, body[data-hat="cap"] .hat-cap, body[data-hat="headphones"] .hat-headphones,
  body[data-hat="tophat"] .hat-tophat, body[data-hat="wizard"] .hat-wizard, body[data-hat="crown"] .hat-crown { display: block; }
  body[data-prop="laptop"] .prop-laptop, body[data-prop="book"] .prop-book, body[data-prop="magnifier"] .prop-magnifier,
  body[data-prop="hardhat"] .prop-hardhat, body[data-prop="globe"] .prop-globe { display: block; }
  body[data-prop="hardhat"] .hat { display: none; } /* safety first */
  .fx-sleep .prop, .fx-fly .prop { display: none !important; }

  /* ---- Pip, a pet of his own: the same feelings as Clawd, a few seconds late ---- */
  #pal { position: absolute; right: 10px; bottom: 30px; width: 30px; height: 27px; display: none; cursor: pointer; }
  .pal #pal { display: block; }
  .quiet #pal { display: none; }
  #pal svg { width: 30px; height: 27px; display: block; shape-rendering: crispEdges; overflow: visible; animation: palbob 2.4s ease-in-out infinite; }
  .pal-body { fill: #8fb8de; }
  .pal-foot { fill: #6c95bb; }
  .pal-eye  { fill: #1d2433; transform-box: fill-box; transform-origin: center; }
  .pal-tear { fill: #bfe3ff; display: none; }
  body[data-pal="up"] #pal svg     { animation: palhop .45s ease-out infinite; }
  body[data-pal="down"] #pal svg   { animation: none; transform: translateY(2px); filter: saturate(.45); }
  body[data-pal="down"] .pal-tear  { display: block; }
  body[data-pal="cross"] #pal svg  { animation: none; transform: scaleX(-1) rotate(-6deg); }
  body[data-pal="cross"] .pal-eye  { transform: scaleY(.5); }
  body[data-pal="jumpy"] #pal svg  { animation: shiver .15s linear infinite; }
  body[data-pal="asleep"] #pal svg { animation: palbob 4.5s ease-in-out infinite; }
  body[data-pal="asleep"] .pal-eye { transform: scaleY(.2); }
  #pal.hop svg { animation: palhop .3s ease-out 3 !important; }
  @keyframes palbob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.5px) } }
  @keyframes palhop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  /* he has the pointer behind his back: it cannot be seen while it is over him */
  body.holding, body.holding * { cursor: none !important; }

  /* ---- one mini per Claude session, when there is more than one ---- */
  #minis { position: absolute; left: 6px; bottom: 34px; display: flex; flex-direction: column-reverse; gap: 5px; }
  .mini { width: 24px; height: 18px; cursor: pointer; }
  .mini svg { width: 24px; height: 18px; display: block; shape-rendering: crispEdges; overflow: visible; }
  .mskin { fill: var(--skin, #d97757); }
  .meye { fill: #1f1410; }
  .mini.idle { opacity: .55; }
  .mini.thinking svg { animation: bob 1.2s ease-in-out infinite; }
  .mini.working svg  { animation: bob .35s ease-in-out infinite; }
  .mini.alert svg    { animation: wiggle .25s ease-in-out infinite; }
  .mini.alert .mskin { filter: saturate(1.35) brightness(1.08) hue-rotate(-8deg); }
  .mini.sad .mskin   { filter: saturate(.45); }
  /* two sessions after the same file: they glare at each other */
  .mini.clash { opacity: 1; }
  .mini.clash svg  { animation: shiver .12s linear infinite; }
  .mini.clash .meye { fill: #e0483c; }

  /* helpers: one little one per subagent, popping out of Clawd and back */
  #helpers { position: absolute; right: 8px; bottom: 34px; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 4px; pointer-events: none; }
  .helper { width: 18px; height: 14px; animation: popout .45s ease-out; }
  .helper svg { width: 18px; height: 14px; display: block; shape-rendering: crispEdges; overflow: visible; animation: bob .5s ease-in-out infinite; }
  .helper .mskin { filter: brightness(1.25) saturate(.8); }
  .helper.out { animation: popin .4s ease-in forwards; }
  /* each kind of helper is its own shade */
  .helper.k-explore .mskin { filter: brightness(1.2) saturate(.8) hue-rotate(170deg); }
  .helper.k-plan .mskin    { filter: brightness(1.25) saturate(.8) hue-rotate(230deg); }
  .helper.k-check .mskin   { filter: brightness(1.2) saturate(.8) hue-rotate(90deg); }

  /* rock, paper, scissors */
  #panel { display: none; gap: 5px; margin-bottom: 6px; padding: 6px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #panel.show { display: flex; }
  #panel button { width: 34px; height: 34px; padding: 0; font: 18px system-ui, sans-serif; border: 2px solid #d97757; border-radius: 9px; background: #fff7f2; cursor: pointer; }
  #panel button:hover { background: #ffe1d4; }
  #panel button.word { width: auto; padding: 0 9px; font-size: 13px; }
  #panel button.x { width: 22px; font-size: 12px; color: #777; border-color: #ccc; background: #fff; }

  /* the week's bar chart, inside the speech bubble */
  .chart { display: flex; align-items: flex-end; gap: 3px; width: 150px; height: 46px; margin-top: 6px; }
  .chart div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: 9px; color: #777; }
  .chart i { display: block; width: 100%; background: #ecb29d; border-radius: 2px 2px 0 0; }
  .chart .now i { background: #d97757; }

  @keyframes popout   { from { opacity: 0; transform: translate(-70px, 10px) scale(.2) } to { opacity: 1; transform: translate(0, 0) scale(1) } }
  @keyframes popin    { to { opacity: 0; transform: translate(-70px, 10px) scale(.2) } }
  @keyframes knock    { 0%,100% { scale: 1 } 50% { scale: 1.12 } }
  @keyframes bow      { 0%,55%,100% { transform: scale(1,1) } 75% { transform: scale(1.05,.84) } }
  @keyframes tapL     { 0%,100% { transform: translateX(0) } 50% { transform: translateX(5px) } }
  @keyframes rub      { 0%,100% { transform: translate(-7px,0) } 25% { transform: translate(0,-5px) } 50% { transform: translate(7px,0) } 75% { transform: translate(0,5px) } }
  @keyframes tapR     { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-5px) } }
  @keyframes nod      { 0%,100% { transform: translateY(0) rotate(0) } 60% { transform: translateY(7px) rotate(6deg) } 70% { transform: translateY(-6px) rotate(0) } 80% { transform: translateY(0) rotate(0) } }
  @keyframes doze     { 0% { transform: scaleY(1) } 30%,62% { transform: scaleY(.1) } 70%,100% { transform: scaleY(1.3) } }
  @keyframes eyeroll  { 0%,100% { transform: translate(0,0) } 25% { transform: translate(-6px,-5px) } 50% { transform: translate(0,-8px) } 75% { transform: translate(6px,-5px) } }
  @keyframes shiver   { 0%,100% { transform: translateX(-2px) } 50% { transform: translateX(2px) } }
  @keyframes headshake { 0%,100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) } }
  @keyframes bigjump  { 0% { transform: translateY(0) scale(1.12,.84) } 20% { transform: translateY(-20px) scale(.94,1.1) } 50% { transform: translateY(-64px) scale(1,1) } 85% { transform: translateY(0) scale(1.1,.88) } 100% { transform: translateY(0) scale(1,1) } }
  @keyframes twirl    { 0%,50%,100% { transform: scaleX(1) } 25%,75% { transform: scaleX(-1) } }
  @keyframes armswing { from { transform: translateY(-4px) } to { transform: translateY(-18px) } }
  @keyframes tapfoot  { 0% { transform: translateY(0) } 100% { transform: translateY(-6px) } }
  @keyframes twinkle  { 0%,100% { opacity: 0 } 50% { opacity: 1 } }
  @keyframes drip     { 0% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(14px) } }
  @keyframes plant    { from { transform: translateY(-34px) } to { transform: translateY(0) } }
  @keyframes flyoff   { 0% { opacity: 1; transform: translate(60px, 70px) } 100% { opacity: 0; transform: translate(250px, -50px) } }
  @keyframes juggle   { 0% { transform: translate(34px, 62px) } 25% { transform: translate(64px, 10px) } 50% { transform: translate(94px, -8px) } 75% { transform: translate(124px, 10px) } 100% { transform: translate(154px, 62px) } }
  @keyframes squat    { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.08,.82) } }
  @keyframes trickle { 0% { opacity: 1 } 100% { opacity: .35 } }
  @keyframes dot     { 0%,100% { opacity: 0; transform: translateY(4px) } 40%,60% { opacity: .95; transform: translateY(0) } }
  @keyframes yawn    { 0%,100% { transform: scale(1,1) } 30%,70% { transform: scale(.97,1.08) } }
  @keyframes gape    { 0%,100% { opacity: 0 } 25%,75% { opacity: 1 } }
  @keyframes stretch { 0%,100% { transform: scale(1,1) } 25%,75% { transform: scale(.93,1.16) } }
  @keyframes puffL   { 0% { opacity: .9; transform: translate(0,0) scale(1) } 100% { opacity: 0; transform: translate(-22px,-8px) scale(1.8) } }
  @keyframes puffR   { 0% { opacity: .9; transform: translate(0,0) scale(1) } 100% { opacity: 0; transform: translate(22px,-8px) scale(1.8) } }
  @keyframes burst   { 0% { opacity: 1; transform: translate(0,0) rotate(0) } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) } }
  @keyframes peer    { 0%,100% { transform: scale(1,1) } 15%,85% { transform: scale(.95,1.1) } }
  @keyframes glance  { 0%,100% { transform: translate(0,0) } 15%,40% { transform: translate(-6px,-1px) } 55%,85% { transform: translate(6px,-1px) } }
  @keyframes squish  { 0% { transform: scale(1,1) } 35% { transform: scale(1.14,.8) } 70% { transform: scale(.96,1.05) } 100% { transform: scale(1,1) } }
  @keyframes dangle  { from { transform: rotate(-10deg) } to { transform: rotate(10deg) } }
  @keyframes float   { 0% { opacity: 0; transform: translateY(0) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-30px) } }
  @keyframes flip    { 0% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-30px) rotate(180deg) } 100% { transform: translateY(0) rotate(360deg) } }
  @keyframes tumble  { from { transform: rotate(0) } to { transform: rotate(360deg) } }
  @keyframes chew    { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.06,.9) } }
