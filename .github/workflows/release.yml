name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # manual run: builds and uploads the installer as an artifact only

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Write checksum
        shell: bash
        run: |
          cd dist
          sha256sum Clawd-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawd-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest.yml and the .blockmap are what the installed app reads to find updates
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt \
            --title "Clawd $GITHUB_REF_NAME" \
            --notes-file .github/release-header.md \
            --generate-notes
