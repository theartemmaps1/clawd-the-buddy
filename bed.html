<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #bed { width: 300px; height: 160px; display: block; shape-rendering: crispEdges; cursor: grab; touch-action: none; }
  #bed:active { cursor: grabbing; }

  /* everything but the bed is earned, and can be put away from the menu */
  .item { display: none; }
  .item.on { display: block; }
  .p1, .p2, .p3 { display: none; }
  body[data-plant="1"] .p1, body[data-plant="2"] .p1, body[data-plant="2"] .p2,
  body[data-plant="3"] .p1, body[data-plant="3"] .p2, body[data-plant="3"] .p3 { display: block; }
  .glow { opacity: 0; }
  .night .glow { opacity: .45; }
  .night .shade { fill: #ffe27a; }
  .bulb { animation: blink 2.4s steps(1) infinite; }
  .bulb:nth-child(2n) { animation-delay: 1.2s; }
  @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
</style>
</head>
<body>
  <!-- a 60x32 grid; main.js knows where each thing stands (ROOM_BOXES) -->
  <svg id="bed" viewBox="0 0 60 32">
    <g class="item" data-id="lights">
      <rect x="3" y="1" width="54" height="1" fill="#5d6470" />
      <rect class="bulb" x="6" y="2" width="2" height="2" fill="#e0483c" /><rect class="bulb" x="14" y="2" width="2" height="2" fill="#f2c230" />
      <rect class="bulb" x="22" y="2" width="2" height="2" fill="#58c064" /><rect class="bulb" x="30" y="2" width="2" height="2" fill="#4aa3df" />
      <rect class="bulb" x="38" y="2" width="2" height="2" fill="#9b6fd6" /><rect class="bulb" x="46" y="2" width="2" height="2" fill="#e0483c" />
      <rect class="bulb" x="53" y="2" width="2" height="2" fill="#f2c230" />
    </g>
    <g class="item" data-id="poster">
      <rect x="20" y="2" width="11" height="12" fill="#8a5a2b" /><rect x="21" y="3" width="9" height="10" fill="#cfe9ff" />
      <rect x="23" y="6" width="5" height="4" fill="#d97757" /><rect x="23" y="10" width="1" height="2" fill="#d97757" /><rect x="27" y="10" width="1" height="2" fill="#d97757" />
      <rect x="24" y="7" width="1" height="1" fill="#1f1410" /><rect x="26" y="7" width="1" height="1" fill="#1f1410" /><rect x="28" y="4" width="1" height="1" fill="#f2c230" />
    </g>
    <g class="item" data-id="shelf">
      <rect x="33" y="9" width="14" height="1" fill="#6e4520" />
      <rect x="35" y="3" width="4" height="3" fill="#f2c230" /><rect x="36" y="6" width="2" height="2" fill="#d9a520" /><rect x="35" y="8" width="4" height="1" fill="#d9a520" />
      <rect x="41" y="5" width="2" height="4" fill="#d9423a" /><rect x="43" y="6" width="2" height="3" fill="#4a60bd" /><rect x="45" y="4" width="1" height="5" fill="#3f9a4a" />
    </g>
    <g class="item" data-id="rug">
      <rect x="6" y="30" width="48" height="2" fill="#b5452f" />
      <rect x="9" y="30" width="3" height="2" fill="#f2c230" /><rect x="48" y="30" width="3" height="2" fill="#f2c230" /><rect x="6" y="31" width="48" height="1" fill="#8f3523" />
    </g>

    <rect x="13" y="19" width="3" height="13" fill="#6e4520" />
    <rect x="44" y="23" width="3" height="9" fill="#6e4520" />
    <rect x="15" y="27" width="30" height="4" fill="#8a5a2b" />
    <rect x="16" y="24" width="28" height="4" fill="#f4f1ea" />
    <rect x="17" y="21" width="8" height="4" fill="#ffffff" />
    <rect x="26" y="23" width="18" height="5" fill="#4a60bd" />
    <rect x="26" y="23" width="18" height="1" fill="#7f93e6" />

    <!-- the plant grows with the streak -->
    <g class="item" data-id="plant">
      <rect x="4" y="27" width="6" height="5" fill="#c8693f" /><rect x="3" y="26" width="8" height="1" fill="#a9532e" />
      <rect x="6" y="23" width="1" height="3" fill="#3f9a4a" /><rect x="7" y="22" width="2" height="1" fill="#58c064" />
      <g class="p1"><rect x="6" y="19" width="1" height="4" fill="#3f9a4a" /><rect x="4" y="20" width="2" height="1" fill="#58c064" /></g>
      <g class="p2"><rect x="6" y="15" width="1" height="4" fill="#3f9a4a" /><rect x="7" y="16" width="2" height="1" fill="#58c064" /></g>
      <g class="p3"><rect x="5" y="12" width="3" height="3" fill="#ff8ac0" /><rect x="6" y="13" width="1" height="1" fill="#ffd84a" /></g>
    </g>
    <g class="item" data-id="lamp">
      <rect class="glow" x="48" y="16" width="12" height="4" fill="#ffe27a" />
      <rect x="51" y="31" width="6" height="1" fill="#33363d" /><rect x="53" y="16" width="2" height="15" fill="#33363d" /><rect class="shade" x="50" y="10" width="8" height="6" fill="#d9a520" />
    </g>
  </svg>
<script src="bed.js"></script>
</body>
</html>
