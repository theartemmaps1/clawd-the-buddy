<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #bed { width: 170px; height: 70px; display: block; shape-rendering: crispEdges; cursor: grab; touch-action: none; }
  #bed:active { cursor: grabbing; }
</style>
</head>
<body>
  <svg id="bed" viewBox="0 0 34 14">
    <rect x="0" y="1" width="3" height="13" fill="#6e4520" />
    <rect x="31" y="5" width="3" height="9" fill="#6e4520" />
    <rect x="2" y="9" width="30" height="4" fill="#8a5a2b" />
    <rect x="3" y="6" width="28" height="4" fill="#f4f1ea" />
    <rect x="4" y="3" width="8" height="4" fill="#ffffff" />
    <rect x="13" y="5" width="18" height="5" fill="#4a60bd" />
    <rect x="13" y="5" width="18" height="1" fill="#7f93e6" />
  </svg>
<script src="bed.js"></script>
</body>
</html>
